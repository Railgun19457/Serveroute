plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'io.github.railgun19457'
version = '0.1.0-beta'

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly 'com.velocitypowered:velocity-api:3.5.1'
    annotationProcessor 'com.velocitypowered:velocity-api:3.5.1'

    implementation 'org.tomlj:tomlj:1.1.1'
    compileOnly 'net.kyori:adventure-text-minimessage:4.17.0'
    compileOnly 'net.kyori:adventure-text-serializer-plain:4.17.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.tomlj:tomlj:1.1.1'
    testImplementation 'net.kyori:adventure-text-minimessage:4.17.0'
    testImplementation 'net.kyori:adventure-text-serializer-plain:4.17.0'
    testImplementation 'org.slf4j:slf4j-api:2.0.16'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.16'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    archiveClassifier.set('plain')
}

shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()
    relocate 'org.tomlj', 'io.github.railgun19457.serveroute.lib.tomlj'
    relocate 'org.antlr', 'io.github.railgun19457.serveroute.lib.antlr'
}

build.dependsOn shadowJar
